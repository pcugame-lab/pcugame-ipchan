version: "3.9"

services:
  labip-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labip-bot
    restart: unless-stopped
    network_mode: host

    env_file:
      - .env

    # IP 등록 데이터 및 로그 영구 보존
    volumes:
      - labip_data:/app/data
      - labip_logs:/app/logs

    healthcheck:
      test: ["CMD", "pgrep", "-f", "python -m app.main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  labip_data:
  labip_logs:
