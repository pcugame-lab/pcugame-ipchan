name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check deployment scripts
        run: bash -n deploy/rootless-deploy.sh deploy/bootstrap.sh

  deploy:
    needs: test
    if: github.repository == 'pcugame-lab/pcugame-ipchan' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.IPCHAN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: ipchan-production
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.IPCHAN_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.IPCHAN_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.IPCHAN_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$SSH_HOST"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ipchan-deploy-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ipchan-known-hosts"
      - name: Upload and deploy exact commit
        env:
          SSH_HOST: ${{ vars.IPCHAN_SSH_HOST }}
          SSH_PORT: ${{ vars.IPCHAN_SSH_PORT }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          port="${SSH_PORT:-5050}"
          options=(-i "$RUNNER_TEMP/ipchan-deploy-key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ipchan-known-hosts")
          destination="gh-deploy@$SSH_HOST"
          root=/home/gh-deploy/server/ipchan
          ssh "${options[@]}" -p "$port" "$destination" "install -d -m 700 '$root/incoming' '$root/releases/$GITHUB_SHA'"
          tar -czf "$RUNNER_TEMP/ipchan-source.tar.gz" app tests requirements.txt Dockerfile .dockerignore deploy
          scp "${options[@]}" -P "$port" "$RUNNER_TEMP/ipchan-source.tar.gz" "$destination:$root/incoming/$GITHUB_SHA.tar.gz"
          ssh "${options[@]}" -p "$port" "$destination" "tar -xzf '$root/incoming/$GITHUB_SHA.tar.gz' -C '$root/releases/$GITHUB_SHA' && bash '$root/releases/$GITHUB_SHA/deploy/rootless-deploy.sh' '$GITHUB_SHA'"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/ipchan-deploy-key" "$RUNNER_TEMP/ipchan-known-hosts"
